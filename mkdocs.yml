site_name: RabbitMQ for Mere Mortals
site_description: A message broker you run yourself. Producers, exchanges, queues and consumers in plain terms, job tickets routed and worked on for real, a worker killed mid-job to prove the work survives, and a restart to prove the messages do, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/rabbitmq-for-mere-mortals/
